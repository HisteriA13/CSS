<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography</title>
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="description" content="Learning web development">
    <meta name="author" content="Hilda Hadžić">
    <link rel="shortcut icon" href="../$logo/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <img src="../$logo/logo.svg" alt="logo" id="logo">

    <!-- BACKGROUND IMAGE -->
    <h1 class="text bcgImg">Become who you are.</h1>

    <!-- GLOWING -->
    <h1 class="text glowing">
        <span>T</span>
        <span>Y</span>
        <span>P</span>
        <span>O</span>
        <span>G</span>
        <span>R</span>
        <span>A</span>
        <span>P</span>
        <span>H</span>
        <span>Y</span>
    </h1>

    <!-- SLIDER -->
    <div class="slider-container">
        <span><br>
            <br>
            css <br>
            is <br>
            fun <br>
        </span>
    </div>
</body>

</html>
