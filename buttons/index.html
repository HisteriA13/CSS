<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="description" content="Learning web development">
    <meta name="author" content="Hilda Hadžić">
    <link rel="shortcut icon" href="../$logo/favicon.svg" type="image/x-icon">

</head>

<body>

    <header>

    <section class="container">

        <button class="btn btnFour">Button Four (4)</button>

        <button class="btn btnFive">Button Five (5)</button>

        <button class="btn btnSix">Button Six (6)</button>

        <button class="btn btnSeven">Button Seven (7)</button>

        <button class="btn btnEight">Button Eight (8)</button>

        <button class="btn btnNine">Button Nine (9)</button>

        <button class="btn btnTen">Button Ten (10)</button>

        <button class="btn btnEleven">Button Eleven (11)</button>

        <div class="btnTwelveContainer">
            <button class="btn btnTwelve">Button Twelve (12)</button>
        </div>

        <button class="btn btnThirteen">Button Thirteen (13)</button>

        <button class="btn btnFourteen">Btn Fourteen (14)</button>

        <button class="btn btnFifteen">Button Fifteen (15)</button>

        <button class="btn btnSixteen">Button Sixteen (16)</button>

        <button class="btn btnSeventeen">
            <span></span>
            Btn Seventeen (17)
        </button>

        <button class="btn btnEighteen">
            <span></span>
            Btn Eighteen (18)
        </button>

    </section>

</body>

</html>
