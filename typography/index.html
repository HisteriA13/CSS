<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography</title>
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="description" content="Learning web development">
    <meta name="author" content="Hilda Hadžić">
    <link rel="shortcut icon" href="../$logo/favicon.svg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Limelight&family=Special+Elite&family=New+Rocker&family=Smokum&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <img src="../$logo/logo.svg" alt="logo" id="logo">

    <!-- BACKGROUND IMAGE -->
    <div>
        <p class="text bcgImg">Become who you are.</p>
    </div>

    <!-- GLOWING -->
    <div class="text glowing">
        <span>T</span>
        <span>Y</span>
        <span>P</span>
        <span>O</span>
        <span>G</span>
        <span>R</span>
        <span>A</span>
        <span>P</span>
        <span>H</span>
        <span>Y</span>
    </div>

    <!-- WAVE -->
    <div class="text wave">
        <span style="--i:1">T</span>
        <span style="--i:2">Y</span>
        <span style="--i:3">P</span>
        <span style="--i:4">O</span>
        <span style="--i:5">G</span>
        <span style="--i:6">R</span>
        <span style="--i:7">A</span>
        <span style="--i:8">P</span>
        <span style="--i:9">H</span>
        <span style="--i:10">Y</span>
    </div>

    <!-- COLOR CHANGE -->
    <div>
        <p class="text color-change">Typography</p>
    </div>

    <!-- 3D -->
    <div class="text threeD">
        <div class="cube">
            <div class="side side1">USE</div>
            <div class="side side2">CODE</div>
            <div class="side side3">FOR</div>
            <div class="side side4">GOOD</div>
        </div>
    </div>


    <!-- GLITCH -->
    <div>
        <p class="text glitch">Typography</p>
    </div>

    <!-- DISAPPEAR -->
    <div class="text disappear">
        <span>T</span>
        <span>Y</span>
        <span>P</span>
        <span>O</span>
        <span>G</span>
        <span>R</span>
        <span>A</span>
        <span>P</span>
        <span>H</span>
        <span>Y</span>
    </div>

    <!-- CAROUSEL -->
    <div>
        <p class="text carousel">Coding is</p>
    </div>
</body>

</html>
