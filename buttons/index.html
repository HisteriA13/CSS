<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="description" content="Learning web development">
    <meta name="author" content="Hilda Hadžić">
    <link rel="shortcut icon" href="../$logo/favicon.svg" type="image/x-icon">
    <script src="https://kit.fontawesome.com/13b9710d71.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <img src="../$logo/logo.svg" alt="logo" id="logo">
    </header>


    <section class="container">

        <button class="btn btnOne">Button (1)</button>

        <button class="btn btnTwo">Button (2)</button>

        <div class="btnThreeContainer">
            <button class="btn btnThree">Button (3)</button>
        </div>

        <button class="btn btnFour">Button (4)</button>

        <button class="btn btnFive">Button (5)</button>

        <button class="btn btnSix">Button (6)</button>

        <button class="btn btnSeven">Button (7)</button>

        <button class="btn btnEight">Button (8)</button>

        <button class="btn btnNine">Button (9)</button>

        <button class="btn btnTen">Button (10)</button>

        <button class="btn btnEleven">Button (11)</button>

        <div class="btnTwelveContainer">
            <button class="btn btnTwelve">Button (12)</button>
        </div>

        <button class="btn btnThirteen">Button (13)</button>

        <button class="btn btnFourteen">Button (14)</button>

        <button class="btn btnFifteen">Button (15)</button>

        <button class="btn btnSixteen">Button (16)</button>

        <button class="btn btnSeventeen">
            <span></span>
            Button (17)
        </button>

        <button class="btn btnEighteen">
            <span></span>
            Button (18)
        </button>

        <button class="btn btnNineteen">Button (19)</button>

        <div class="btn btnTwenty">
            <div class="top">Button (20) - top</div>
            <div class="front">Button (20) - front</div>
        </div>

        <button class="btn btnTwentyOne">Button (21)</button>

        <button class="btn btnTwentyTwo">
            <span>
                Button (22)
                <i class="fa-solid fa-arrow-trend-up"></i>
            </span>
        </button>

        <button class="btn btnTwentyThree">Button (23)</button>

    </section>

</body>

</html>
