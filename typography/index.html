<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography</title>
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="description" content="Learning web development">
    <meta name="author" content="Hilda Hadžić">
    <link rel="shortcut icon" href="../$logo/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <img src="../$logo/logo.svg" alt="logo" id="logo">

    <!-- BACKGROUND IMAGE -->
    <div>
        <h1 class="text bcgImg">Become who you are.</h1>
    </div>

    <!-- GLOWING -->
    <div class="text glowing">
        <span>T</span>
        <span>Y</span>
        <span>P</span>
        <span>O</span>
        <span>G</span>
        <span>R</span>
        <span>A</span>
        <span>P</span>
        <span>H</span>
        <span>Y</span>
    </div>

    <!-- SLIDER -->
    <!-- <div class="slider-container">
        <span><br>
            <br>
            css <br>
            is <br>
            fun <br>
        </span>
    </div> -->

    <!-- WAVE -->
    <div class="text wave">
        <span style="--i:1">T</span>
        <span style="--i:2">Y</span>
        <span style="--i:3">P</span>
        <span style="--i:4">O</span>
        <span style="--i:5">G</span>
        <span style="--i:6">R</span>
        <span style="--i:7">A</span>
        <span style="--i:8">P</span>
        <span style="--i:9">H</span>
        <span style="--i:10">Y</span>
    </div>

    <!-- 3D -->
    <div class="text threeD">
        <div class="cube">
            <div class="side side1">CSS</div>
            <div class="side side2">IS</div>
            <div class="side side3">FUN</div>
            <div class="side side4">✌️</div>
        </div>
    </div>
    <!-- COLOR CHANGE -->
    <div class="text color-change">
        <p>Typography</p>
    </div>


</body>

</html>
