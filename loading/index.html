<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="description" content="Learning web development">
    <meta name="author" content="Hilda Hadžić">
    <link rel="shortcut icon" href="../$logo/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <img src="../$logo/logo.svg" alt="logo" id="logo">

    <section class="container">
        <!-- LOADING DOT CIRCLE -->
        <div class="wrapper dot-wrapper">
            <div class="loader-dot">
                <div class="dot"></div>
            </div>
            <div class="loader-dot">
                <div class="dot"></div>
            </div>
            <div class="loader-dot">
                <div class="dot"></div>
            </div>
            <div class="loader-dot">
                <div class="dot"></div>
            </div>
            <div class="loader-dot">
                <div class="dot"></div>
            </div>
            <div class="loader-dot">
                <div class="dot"></div>
            </div>
        </div>

        <!-- LAZY BOUNCE -->
        <div class="wrapper lazy-bounce-wrapper">
            <div class="lazy-bounce"></div>
            <div class="lazy-bounce"></div>
            <div class="lazy-bounce"></div>
            <div class="lazy-bounce"></div>
        </div>

        <!-- DYNAMIC -->
        <div class="wrapper dynamic-wrapper">
            <span class="dynamic dynamicOne"></span>
            <span class="dynamic dynamicTwo"></span>
            <span class="dynamic dynamicThree"></span>
            <span class="dynamic dynamicFour"></span>
        </div>

        <!-- SPINNER -->
        <div class="wrapper spinner-wrapper">
            <div class="spinner"></div>
        </div>

        <!-- ROTATING SQUARE -->
        <div class="wrapper rotating-square-wrapper">
            <div class="rotating-square rotating-squareOne"></div>
            <div class="rotating-square rotating-squareTwo"></div>
            <div class="rotating-square rotating-squareThree"></div>
        </div>

        <!-- SVG POLYLINE -->
        <div class="wrapper svg-polyline-wrapper">
            <svg class="svg-polyline" viewBox="0 0 48.87 48.78">
                <polyline
                    points="6.01 15.13 24.92 5.5 5.5 29.59 42.73 10.02 7.42 41.24 43.37 23.89 22.39 43.28 42.99 37.97" />
            </svg>
        </div>

        <!-- PROGRESS-BAR -->
        <div class="wrapper progress-bar">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- BASIC-LOADING -->
        <div class="wrapper basic-loading-wrapper">
            <span class="basic-loading"></span>
        </div>

        <!-- BOUNCER -->
        <div class="wrapper bouncer-wrapper">
            <span class="bouncer"></span>
            <span class="bouncer"></span>
            <span class="bouncer"></span>
            <span class="bouncer"></span>
        </div>

        <!-- EQUALIZER -->
        <div class="wrapper equalizer">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
    </section>

</body>

</html>
