<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards Styles on Hover</title>
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="description" content="Learning web development">
    <meta name="author" content="Hilda Hadžić">
    <link rel="shortcut icon" href="../$logo/favicon.svg" type="image/x-icon">
    <script src="https://kit.fontawesome.com/13b9710d71.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <img src="../$logo/logo.svg" alt="logo" id="logo">

    <!-- ----------------------------------------- -->
    <!--                 CARD ONE                  -->
    <!-- ----------------------------------------- -->
    <section class="card cardOne">
        <figure class="img-wrapperOne">
            <img src="img/cardOne.png" alt="Shadows of the Tomb Raider">
        </figure>
        <div class="content contentOne">
            <p>Shadows of the Tomb Raider</p>
        </div>
    </section>

    <!-- ----------------------------------------- -->
    <!--                 CARD TWO                  -->
    <!-- ----------------------------------------- -->
    <section class="card cardTwo">
        <figure>
            <img src="img/cardTwo.png" alt="Rise of the Tomb Raider">
        </figure>
        <div class="content contentTwo">
            <p>Rise of the Tomb Raider</p>
            <a href="#">Learn More</a>
        </div>
    </section>

    <!-- ----------------------------------------- -->
    <!--                CARD THREE                 -->
    <!-- ----------------------------------------- -->
    <section class="card cardThree">
        <figure>
            <img src="img/cardThree.png" alt="Reggae Lion with Sunglases">
            <div class="third-card"></div>
        </figure>
    </section>

    <!-- ----------------------------------------- -->
    <!--                 CARD FOUR                 -->
    <!-- ----------------------------------------- -->
    <section class="card cardFour">
        <figure class="img-wrapperFour">
            <img src="img/cardFour.png" alt="Rastaman Playing a Guitar on the Stairs">
        </figure>
        <div class="content contentFour">
            <p>Lorem ipsum dolor sit amet</p>
            <ul>
                <li><a href="#"><i class="fa-brands fa-github"></i></a></li>
                <li><a href="#"><i class="fa-brands fa-square-linkedin"></i></a></li>
                <li><a href="#"><i class="fa-brands fa-instagram"></i></a></li>
            </ul>
        </div>
    </section>

    <!-- ----------------------------------------- -->
    <!--                 CARD FIVE                 -->
    <!-- ----------------------------------------- -->
    <section class="card cardFive">
        <input type="checkbox" class="inputFive">
        <div class="toggleFive">+</div>
        <figure class="img-wrapperFive">
            <img src="img/cardFive.png" alt="Gaming">
        </figure>
        <div class="content contentFive">
            <p>Lorem ipsum dolor sit amet</p>
        </div>
    </section>

    <!-- ----------------------------------------- -->
    <!--                 CARD SIX                  -->
    <!-- ----------------------------------------- -->
    <section class="card cardSix">
        <figure class="img-wrapperSix">
            <img src="img/cardSix.png" alt="Coding">
        </figure>
        <div class="content contentSix">
            <p>Lorem ipsum dolor sit amet</p>
        </div>
    </section>

    <!-- ----------------------------------------- -->
    <!--                CARD SEVEN                 -->
    <!-- ----------------------------------------- -->
    <section class="card cardSeven">
        <figure>
            <img src="img/cardSeven.png" alt="AC - Odyssey">
        </figure>
        <div class="content contentSeven">
            <p>AC - Odyssey</p>
        </div>
    </section>

    <!-- ----------------------------------------- -->
    <!--                CARD EIGHT                 -->
    <!-- ----------------------------------------- -->
    <section class="card cardEight">
        <figure>
            <img src="img/cardEight.png" alt="AC - Valhalla">
        </figure>
    </section>

    <!-- ----------------------------------------- -->
    <!--                 CARD NINE                 -->
    <!-- ----------------------------------------- -->
    <section class="card cardNine" data-title="Shadows">
        <figure>
            <img src="img/cardNine.png" alt="AC - Shadows">
        </figure>
    </section>
</body>

</html>
